
name: Build ATIDA ULTIMATE 6.1 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ATIDA ZIP
        run: |
          ZIP_FILE="./ATIDA_ULTIMATE_6.1_SERVER_FIXED_KOTLIN_PATCH.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ATIDA ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d atida_source

          SETTINGS_FILE=$(find atida_source -type f -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Android app folder not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin target compatibility
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          build_file = project / "app" / "build.gradle.kts"

          if not build_file.exists():
              raise SystemExit("app/build.gradle.kts not found.")

          text = build_file.read_text()

          text = text.replace("VERSION_1_8", "VERSION_17")
          text = text.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')

          if "compileOptions" not in text:
              block = """
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
              """

              pos = text.find("android {")
              if pos == -1:
                  raise SystemExit("Could not find android block.")

              depth = 0
              end = None

              for i in range(text.find("{", pos), len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break

              if end is None:
                  raise SystemExit("Could not locate end of android block.")

              text = text[:end] + block + text[end:]

          build_file.write_text(text)
          print("Java compatibility set to version 17.")
          PY

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ATIDA-ULTIMATE-6.1-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATIDA-ULTIMATE-6.1-APK
          path: ATIDA-ULTIMATE-6.1-debug.apk
          if-no-files-found: error
